<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/game.css">
    <link rel="stylesheet" href="./css/menu.css">
    <script type="module" src="./js/main.js"></script>
    <!-- <script type="module" src="./js/ui.js"></script> -->
    <title>Document</title>
</head>
<body>
    
    <section id="menu">
        <h1 class="title">Virus!</h1>
        <div class="menu">
            <button id="play">Singleplayer</button>
            <button>Multiplayer</button>
            <button>Options</button>
            <button>credits</button>
        </div>
    </section>
    

    <main class="game-container" id="viewMap" style="display: none;">
        <section class="bodyGame">
                <div id="brain-slot" class="organSlot">asdas</div>
                <div id="heart-slot" class="organSlot">asda</div>
                <div id="stomach-slot" class="organSlot">adsda</div>
                <div id="bone-slot" class="organSlot">asdasd</div>
                <div id="nervous-slot" class="organSlot">adsd</div>
                <div ></div>
        </section>

        <section class="map-game">
            <!-- Mano del adversario -->
            <div class="oponent-hand-cards">
                <div class="hand" id="oponent-hand"></div>
            </div>

            <!-- Cuerpo del adversario -->
            <!-- <div class="oponent-body">cuerpo rival</div> -->

            <!-- Sectores de la Mesa -->
            <div class="board">
                <div class="zone" id="deck-zone">
                    <h2>Mazo</h2>
                    <div class="card deck" id="deck">🎴<br><span id="deck-count">68</span></div>
                </div>
            
                <div class="zone" id="exile-zone">
                    <h2>Destierro</h2>
                    <div class="card-slot" id="exile-slot"></div>
                </div>
            
                <div class="zone" id="discard-zone">
                    <h2>Descarte</h2>
                    <div class="card-slot" id="discard-slot">Vacio</div>
                </div>
            </div>
            
            <!-- Cuerpo del Jugador -->
            <!-- <div class="player-body">cuerpo del jugador</div> -->

            <!-- Mano del Jugador -->
            <div class="player-hand-cards">
                <div class="hand" id="player-hand"></div>
            </div>
        </section>

        <section class="bodyRivals" Id="rivals">
            <button id="turn">final del turno</button>
        </section>
    </main>

    <section id="options"></section>
</body>
</html>
