<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/layout.css">
    <link rel="stylesheet" href="./css/board.css">
    <link rel="stylesheet" href="./css/components.css">
    <link rel="stylesheet" href="./css/organs.css">
    <link rel="stylesheet" href="./css/menu.css">
    <link rel="stylesheet" href="./css/responsive.css">
    <script type="module" src="./js/main.js"></script>
    <title>Document</title>
</head>
<body>
    
    <section id="menu">
        <h1 class="title">Virus!</h1>
        <div class="menu">
            <div class="selectPlayer">
                <button id="playerO" class="select orange"></button>
                <button id="playerB" class="select blue"></button>
                <button id="playerR" class="select red"></button>
                <button id="playerY" class="select yellow"></button>
                <button id="playerG" class="select green"></button>
            </div>
            <button id="play">Jugar!</button>
            <button>Options</button>
            <button>credits</button>
        </div>
    </section>
    

    <main class="game-container" id="viewMap" style="display: none;">
        <section class="bodyGame">
                <div id="brain-slot" class="organSlot player"></div>
                <div id="heart-slot" class="organSlot player"></div>
                <div id="stomach-slot" class="organSlot player"></div>
                <div id="bone-slot" class="organSlot player"></div>
                <div id="nervous-slot" class="organSlot player"></div>
                <div id="bionic-slot" class="organSlot player"></div>
        </section>

        <section class="map-game">
            <!-- Mano del adversario -->
            <div class="panel-central-superior">
                <!-- <div class="hand" id="oponent-hand"></div> -->
                <!-- Lado Izquierdo: Información del juego -->
                <div class="panel-info-turno">
                    <div class="indicador-turno" id="info-turno-texto">TURNO DE: <span class="nombre-rival">RIVAL 1</span></div>

                    <div class="historial-acciones" id="historial-lineas"></div>
                </div>

                <!-- Lado Derecho: Contenedor de la carta activa -->
                <div class="panel-carta-activa">
                    <div class="slot-carta-flotante" id="slot-carta-flotante">

                    </div>
                </div>
            </div>

            <!-- Sectores de la Mesa -->
            <div class="board">
                <div class="zone" id="deck-zone">
                    <h2>Mazo</h2>
                    <div class="card deck" id="deck">🎴<br><span id="deck-count">68</span></div>
                </div>
            
                <div class="zone" id="exile-zone">
                    <h2>Destierro</h2>
                    <div class="card-slot" id="exile-slot"></div>
                </div>
            
                <div class="zone" id="discard-zone">
                    <h2>Descarte</h2>
                    <div class="card-slot" id="discard-slot">Vacio</div>
                </div>
            </div>

            <!-- Mano del Jugador -->
            <div class="player-hand-cards">
                <div class="hand" id="player-hand"></div>
            </div>
        </section>

        <section class="bodyRivals" Id="rivals">
            <button id="toggle-rivals-btn" class="toggle-btn">👥 rivales</button>
            <div class="bodyPlayers">
                <div id="bodyRivalOne" class="rivalOne">
                    <div id="brain-slot-rivalOne" class="organSlot"></div>
                    <div id="heart-slot-rivalOne" class="organSlot"></div>
                    <div id="stomach-slot-rivalOne" class="organSlot"></div>
                    <div id="bone-slot-rivalOne" class="organSlot"></div>
                    <div id="nervous-slot-rivalOne" class="organSlot"></div>
                    <div id="bionic-slot-rivalOne" class="organSlot"></div>
                </div>
                <div id="bodyRivalTwo" class="rivalTwo">
                    <div id="brain-slot-rivalTwo" class="organSlot"></div>
                    <div id="heart-slot-rivalTwo" class="organSlot"></div>
                    <div id="stomach-slot-rivalTwo" class="organSlot"></div>
                    <div id="bone-slot-rivalTwo" class="organSlot"></div>
                    <div id="nervous-slot-rivalTwo" class="organSlot"></div>
                    <div id="bionic-slot-rivalTwo" class="organSlot"></div>
                </div>
                <div id="bodyRivalThree" class="rivalThree">
                    <div id="brain-slot-rivalThree" class="organSlot"></div>
                    <div id="heart-slot-rivalThree" class="organSlot"></div>
                    <div id="stomach-slot-rivalThree" class="organSlot"></div>
                    <div id="bone-slot-rivalThree" class="organSlot"></div>
                    <div id="nervous-slot-rivalThree" class="organSlot"></div>
                    <div id="bionic-slot-rivalThree" class="organSlot"></div>
                </div>
                <div id="bodyRivalFour" class="rivalFour">
                    <div id="brain-slot-rivalFour" class="organSlot"></div>
                    <div id="heart-slot-rivalFour" class="organSlot"></div>
                    <div id="stomach-slot-rivalFour" class="organSlot"></div>
                    <div id="bone-slot-rivalFour" class="organSlot"></div>
                    <div id="nervous-slot-rivalFour" class="organSlot"></div>
                    <div id="bionic-slot-rivalFour" class="organSlot"></div>
                </div>
            </div>
        </section>
    </main>

    <section id="options"></section>
</body>
</html>
